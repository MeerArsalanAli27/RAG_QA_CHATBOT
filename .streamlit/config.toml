[theme]
base = "light"
primaryColor = "#6857E8"
backgroundColor = "#F5F6FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#20263A"
borderColor = "#E2E5F0"
baseRadius = "large"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
paddingTop = "2rem"
paddingBottom = "2rem"

[theme.sidebar]
backgroundColor = "#EEEFFC"
secondaryBackgroundColor = "#E6E8F7"
textColor = "#20263A"
borderColor = "#D9DCEF"
